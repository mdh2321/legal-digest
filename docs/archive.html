        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #faf8f5;

            --text-primary: #1a1a1a;

        .brand {

            gap: 0.75rem;

        .brand-icon {

            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .nav-links a:hover {
            color: var(--text-primary);
        }

        .archive-list {
            list-style: none;
        }

        .archive-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border);
        }

        .archive-item:last-child {
            border-bottom: none;
        }

        .archive-item a {
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 500;
        }

        .archive-item a:hover {
            color: var(--accent-dark);
        }

        .archive-date {
            color: var(--text-muted);

        }

        .info-box {
            background: var(--bg-accent);
            border-radius: 8px;
